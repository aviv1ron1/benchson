[project]
name = "benchson"
version = "0.1.0"
description = "GenAI JSON generation benchmark"
requires-python = ">=3.13"
dependencies = [
    "jsonschema",
    "deepdiff",
    "datasets>=5.0.0",
]

[dependency-groups]
watsonx = [
    "langchain-ibm>=0.3",
]
hf = [
    "transformers>=4.43",
    "torch>=2.0",
    "accelerate>=0.26",
]
vllm = [
    "vllm>=0.5",
]
